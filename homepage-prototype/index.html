<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8fafc">
  <title>K.O.T.A.K Browser — New Tab</title>
  <style>
    :root { color-scheme: light; --bg:#f8fafc; --ink:#111827; --muted:#64748b; --line:#e2e8f0; --card:#fff; --accent:#0f172a; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100svh; background:var(--bg); color:var(--ink); font:16px/1.45 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    main { width:min(720px,100%); margin:0 auto; padding: max(24px, env(safe-area-inset-top)) 22px max(24px, env(safe-area-inset-bottom)); }
    header { display:flex; align-items:center; gap:12px; }
    .logo { width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--accent);color:white;font-weight:750;letter-spacing:-1px; }
    .brand { font-size:1.05rem;font-weight:750;letter-spacing:.02em; }
    .tagline { color:var(--muted);font-size:.82rem;margin-top:1px; }
    .settings { margin-left:auto; border:1px solid var(--line);background:var(--card);color:var(--muted);width:42px;height:42px;border-radius:14px;cursor:pointer;font-size:1.1rem; }
    .hero { text-align:center;margin:clamp(62px,15vh,132px) 0 30px; }
    h1 { margin:0;font-size:clamp(2.25rem,8vw,3.5rem);line-height:1.05;letter-spacing:-.065em; }
    .intro { color:var(--muted);margin:14px 0 0;font-size:.98rem; }
    form { display:flex;align-items:center;gap:10px;padding:7px 8px 7px 17px;border:1px solid var(--line);border-radius:999px;background:var(--card);box-shadow:0 8px 30px #0f172a08; }
    form:focus-within { border-color:#94a3b8;box-shadow:0 0 0 4px #cbd5e133; }
    .search-icon { color:var(--muted);font-size:1.15rem; }
    input { flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:10px 0; }
    input::placeholder { color:#94a3b8; }
    .go { width:40px;height:40px;border:0;border-radius:50%;background:var(--accent);color:#fff;font-size:1.1rem;cursor:pointer; }
    .section-head { display:flex;align-items:center;justify-content:space-between;margin:34px 2px 14px; }
    h2 { font-size:.88rem;margin:0;font-weight:650; }
    .hint { color:var(--muted);font-size:.75rem; }
    .shortcuts { display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px; }
    .shortcut { display:flex;flex-direction:column;align-items:center;gap:10px;padding:15px 4px 12px;text-decoration:none;color:var(--ink);border-radius:16px; }
    .shortcut:hover,.shortcut:focus-visible { background:#eef2f7;outline:none; }
    .tile { width:48px;height:48px;border-radius:16px;background:#e2e8f0;display:grid;place-items:center;font-size:1rem;font-weight:750;color:#334155; }
    .tile.red { background:#fee2e2;color:#991b1b; }.tile.green { background:#d1fae5;color:#065f46; }.tile.blue { background:#dbeafe;color:#1d4ed8; }
    .shortcut span:last-child { font-size:.78rem;color:#475569; }
    footer { display:flex;align-items:center;justify-content:center;gap:7px;color:#94a3b8;font-size:.75rem;margin-top:clamp(45px,12vh,100px); }
    @media (max-width:380px) { main { padding-left:16px;padding-right:16px; }.shortcuts { gap:2px; }.tile { width:44px;height:44px; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="logo" aria-hidden="true">K.</div>
      <div><div class="brand">K.O.T.A.K</div><div class="tagline">A quieter way to browse.</div></div>
      <button class="settings" type="button" aria-label="Homepage settings" title="Homepage settings" id="settings">⋯</button>
    </header>

    <section class="hero" aria-labelledby="heading">
      <h1 id="heading">Explore.</h1>
      <p class="intro">What would you like to find today?</p>
    </section>

    <form id="search-form" role="search">
      <span class="search-icon" aria-hidden="true">⌕</span>
      <input id="query" name="q" type="text" placeholder="Search or enter a website" aria-label="Search or enter a website" autocomplete="off" autocapitalize="off" spellcheck="false" autofocus>
      <button class="go" type="submit" aria-label="Search">→</button>
    </form>

    <div class="section-head"><h2>Quick links</h2><span class="hint">Your everyday web</span></div>
    <nav class="shortcuts" aria-label="Quick links">
      <a class="shortcut" href="https://www.youtube.com/"><span class="tile red">▶</span><span>YouTube</span></a>
      <a class="shortcut" href="https://github.com/"><span class="tile">GH</span><span>GitHub</span></a>
      <a class="shortcut" href="https://chatgpt.com/"><span class="tile green">AI</span><span>ChatGPT</span></a>
      <a class="shortcut" href="https://www.google.com/"><span class="tile blue">G</span><span>Google</span></a>
    </nav>

    <footer><span aria-hidden="true">◈</span><span>Simple by design. Your browsing, your choice.</span></footer>
  </main>
  <script>
    const form = document.querySelector('#search-form');
    const input = document.querySelector('#query');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const value = input.value.trim();
      if (!value) { input.focus(); return; }
      const looksLikeUrl = /^(https?:\/\/)/i.test(value) || (/^[^\s.]+\.[^\s]+$/.test(value) && !value.includes(' '));
      const destination = looksLikeUrl
        ? ( /^https?:\/\//i.test(value) ? value : 'https://' + value )
        : 'https://www.google.com/search?q=' + encodeURIComponent(value);
      window.location.href = destination;
    });
    document.querySelector('#settings').addEventListener('click', () => {
      alert('Homepage settings will be added in a later version.');
    });
  </script>
</body>
</html>
