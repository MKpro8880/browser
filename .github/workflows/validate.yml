name: Validate K.O.T.A.K project

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Validate required files and shell syntax
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f docs/ARCHITECTURE.md
          test -f docs/BUILDING.md
          test -f docs/ANDROID_PLAN.md
          test -f docs/FREE_WORKFLOW.md
          test -f docs/ROADMAP.md
          test -f patches/series
          bash -n scripts/sync-chromium.sh
          bash -n scripts/build-linux.sh
          bash -n scripts/build-android.sh
          bash -n scripts/check-build-capacity.sh
          echo "K.O.T.A.K repository scaffold is valid."

# This workflow performs lightweight checks only. It does not fetch or build Chromium.
